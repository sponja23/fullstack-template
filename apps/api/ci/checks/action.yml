name: Checks for @repo/api
description: Run static checks and the built API smoke test.
runs:
  using: composite
  steps:
    - name: Static checks
      shell: bash
      working-directory: apps/api
      run: pnpm exec vp check --no-error-on-unmatched-pattern .
    - name: Build dependency closure
      if: ${{ !cancelled() }}
      shell: bash
      run: pnpm --filter @repo/api... build
    - name: Test
      if: ${{ !cancelled() }}
      shell: bash
      working-directory: apps/api
      run: pnpm exec vp test run

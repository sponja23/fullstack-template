name: Checks for @repo/logger
description: Run static checks and tests.
runs:
  using: composite
  steps:
    - name: Static checks
      shell: bash
      working-directory: packages/logger
      run: pnpm exec vp check --no-error-on-unmatched-pattern .
    - name: Test
      if: ${{ !cancelled() }}
      shell: bash
      working-directory: packages/logger
      run: pnpm exec vp test run
